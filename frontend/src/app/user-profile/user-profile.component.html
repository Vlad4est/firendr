<main>
    <h1>Edit Profile</h1>
    
    <div class="profile-section">
        <div class="profile-picture">
            <!-- You can replace this with an actual image -->
            <span>📷</span>
        </div>
        <button (click)="changeProfilePicture()">Change Profile Picture</button>
    </div>

    <form (ngSubmit)="saveChanges()">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" [(ngModel)]="username">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" [(ngModel)]="email">
        </div>

        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" [(ngModel)]="newPassword">
        </div>

        <button type="submit" class="save-btn">Save Changes</button>
    </form>
</main>
