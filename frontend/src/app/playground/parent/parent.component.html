<div class="parent">
    <h2>
        Parent
    </h2>

    <input type="text"  placeholder="Title..."  [(ngModel)]="title"> <br>
    <br>
    <input type="text"  placeholder="Description" [(ngModel)]="desciption"> <br>
    <br>
    <button (click)="createPost()">Submit</button>
    
    <ng-container *ngFor="let post of posts">
    <app-child [post]="post"></app-child>
    </ng-container>
</div>
