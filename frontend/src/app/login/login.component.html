<div class="container">
    <div class="login-card">
        <h1>Login into Friendr</h1>
        <div>Sign into your account</div>
        <input type="text" placeholder="Username"  [(ngModel)]="username">
        <input type="password" placeholder="Password"> 
        <button class="sign-in-btn" (click)="login()">Login</button>
    </div>
</div>
