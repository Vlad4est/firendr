<div class="post">
    <div class="post-header">
      <div class="post-header-profile">
        <img class="avatar" [src]="userAvatarUrl" />
        <div class="post-user-details">
          <div class="post-username">{{ post.author || "Anonymous"}}</div>
          <div class="post-date-created">{{ post.createdAt | date }}</div>
        </div>
      </div>
      <button class="following-btn basic-btn">Following</button>
      <!-- <button class="follow-btn basic-btn">Follow</button> -->
    </div>
    <div class="post-body">
      <h3>{{ post.title }}</h3>
      <img src="test-img.png" />
      <div>
       {{ post.description }}
      </div>
    </div>
    <div class="post-footer"></div>
  </div>
